name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          plugin_code: yes
          plugin_code_languages: javascript, typescript, python, go, java, c, csharp, c++
          plugin_code_load: 400
          plugin_code_days: 30
          plugin_code_lines: 12
